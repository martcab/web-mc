# Publica cabrera.pe en GitHub Pages.
# Se ejecuta al subir cambios a main, cada mañana (para las publicaciones
# programadas con fecha futura) y a mano desde la pestaña Actions.
name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'   # 06:17 en Lima (UTC-5)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar publicaciones
        env:
          TZ: America/Lima
        run: python3 herramientas/publicar.py
      - name: Armar carpeta pública
        run: python3 herramientas/armar_sitio.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
